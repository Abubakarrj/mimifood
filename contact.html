<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Contact Mimi Food — Los Angeles</title>
  <meta name="description" content="Get in touch with Mimi Food about an order, a subscription, wholesale or anything else. Email us or send a message and we'll get back to you.">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mimi Food">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Mimi Food">
  <meta property="og:title" content="Contact Mimi Food — Los Angeles">
  <meta property="og:description" content="Get in touch with Mimi Food about an order, a subscription, wholesale or anything else. Email us or send a message and we'll get back to you.">
  <meta property="og:image" content="%SITE_URL%/assets/og-home.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/assets/favicon-96.png" type="image/png" sizes="96x96">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="contact">
  <main id="main">

    <div class="page">
      <header class="page-head" data-reveal>
        <h1>Contact</h1>
        <p class="contact-chat">Prefer to chat? <button type="button" data-chat-open>Chat with us</button></p>
      </header>

      <div class="contact-layout">

        <div data-reveal>
          <form class="form" data-contact-form>
            <div class="form-grid">
              <label>Name<input name="name" required autocomplete="name"></label>
              <label>Email<input name="email" type="email" required autocomplete="email"></label>
            </div>
            <label>Topic
              <select name="topic">
                <option value="General">General</option>
                <option value="Order">Order</option>
                <option value="Wholesale">Wholesale</option>
                <option value="Press">Press</option>
                <option value="Careers">Careers</option>
              </select>
            </label>
            <label>Message<textarea name="message" required></textarea></label>
            <p class="sub-error" data-contact-error role="alert"></p>
            <button class="button" type="submit">Send Message</button>
          </form>
          <p data-contact-sent hidden role="status">Thanks. We'll reply by email, usually within a day.</p>
        </div>

        <!-- After the form, so the form is the first thing on a phone; beside it on wide screens. -->
        <figure class="contact-map" data-contact-map data-reveal>
          <div class="contact-map-view">
            <div class="contact-map-frame" data-map-frame></div>
            <div class="contact-map-zoom" data-map-zoom hidden>
              <button type="button" data-map-in aria-label="Zoom in">+</button>
              <button type="button" data-map-out aria-label="Zoom out">−</button>
              <button type="button" data-map-home aria-label="Back to Mimi Food"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="8" r="1.8" fill="currentColor"/><path d="M8 0v3M8 13v3M0 8h3M13 8h3" stroke="currentColor" stroke-width="1.5"/></svg></button>
            </div>
            <span class="contact-map-pin" data-map-pin aria-hidden="true"><svg viewBox="0 0 48 60"><path d="M24 58C24 58 4 36.5 4 22a20 20 0 0 1 40 0c0 14.5-20 36-20 36Z" fill="#2f7a34"/><circle cx="24" cy="22" r="14" fill="#fff"/><image href="/assets/logo-mark.png" x="12" y="10" width="24" height="24"/></svg></span>
            <small class="contact-map-credit">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></small>
          </div>
          <figcaption class="contact-map-card" data-map-card></figcaption>
        </figure>
      </div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
