<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Order Ahead — Mimi Food</title>
  <meta name="description" content="Order ahead at Mimi Food: choose a pickup time and skip the line. Delivery from our pour bars is available nearby too.">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mimi Food">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Mimi Food">
  <meta property="og:title" content="Order Ahead — Mimi Food">
  <meta property="og:description" content="Order ahead at Mimi Food: choose a pickup time and skip the line. Delivery from our pour bars is available nearby too.">
  <meta property="og:image" content="%SITE_URL%/assets/og-home.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/assets/favicon-96.png" type="image/png" sizes="96x96">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="order">
  <main id="main">

    <div class="page">
      <header class="page-head" data-reveal>
        <h1>Order Ahead</h1>
        <p>Choose a location, pick a time and add your drinks and food. Pay online and pick up at the bar.</p>
      </header>

      <div class="order-layout">
        <div class="order-side" data-reveal>
          <div class="order-side-head">
            <p class="section-label">Select location</p>
            <span class="order-side-links">
              <button type="button" class="link-button" data-nearest>Find the nearest shop</button>
              <a class="link-button" data-delivery-link href="order?mode=delivery">Prefer delivery?</a>
            </span>
          </div>
          <div class="choice-list" data-order-locations></div>
        </div>
        <figure class="order-location" data-order-location data-reveal style="--i:1" aria-live="polite"></figure>
      </div>

      <div class="order-bar" data-order-bar></div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
