<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mimi Food — Korean Sauces, Soups & Seasonings</title>
  <meta name="description" content="Korean sauces, dressings, soup bases and Mala seasonings for home cooking and restaurants. Shop online with free shipping over $60.">
  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mimi Food">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Mimi Food">
  <meta property="og:title" content="Mimi Food — Korean Sauces, Soups & Seasonings">
  <meta property="og:description" content="Korean sauces, dressings, soup bases and Mala seasonings for home cooking and restaurants. Shop online with free shipping over $60.">
  <meta property="og:image" content="%SITE_URL%/assets/og-home.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <!-- The signature, written out: apps that play link videos (Facebook, Discord) show it; the rest show the image above. -->
  <meta property="og:video" content="%SITE_URL%/assets/og-home.mp4">
  <meta property="og:video:secure_url" content="%SITE_URL%/assets/og-home.mp4">
  <meta property="og:video:type" content="video/mp4">
  <meta property="og:video:width" content="1200">
  <meta property="og:video:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/assets/favicon-96.png" type="image/png" sizes="96x96">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="home">
  <main id="main">
    <h1 class="visually-hidden">Korean Sauces, Soups and Seasonings</h1>

    <!-- Three screens: the photo, then the statement, then the shop (banner on top). The first
         two don't scroll: a tap moves on. From the shop on, the page scrolls as usual. -->
    <!-- The photo changes every 15 minutes (server.ts, HERO_PHOTOS); this one is the default. -->
    <section class="hero" aria-label="Mimi Food" data-next="about" data-hero-rotate>
      <picture>
        <img class="hero-image" src="assets/home-turning.webp" alt="Mimi Food sauces" fetchpriority="high" style="--hero-pos: 50% 55%; --hero-pos-wide: 50% 50%">
      </picture>
      <!-- Placeholder for the hero video: add assets/hero.mp4 and it plays here, muted and looping. -->
      <video class="hero-video" muted loop playsinline preload="auto" aria-hidden="true" data-hero-video>
        <source src="assets/hero.mp4" type="video/mp4">
      </video>
      <!-- The photo also moves on with a tap; a first-time visitor is shown so. -->
      <p class="hero-cue" aria-hidden="true"><span class="hero-cue-dot"></span><span>Explore</span></p>
    </section>

    <section class="brand-statement" id="about" aria-label="About Mimi Food" data-next="shop">
      <p data-words>At Mimi Food, we make Korean flavors easy to cook at home.</p>
      <p data-words>Sauces, dressings, soup bases and Mala seasonings, ready for your kitchen.</p>
      <div class="statement-ctas">
        <a class="button is-outline statement-cta" href="shop">Shop All</a>
      </div>
    </section>

    <div class="shop" id="shop">
      <div class="ticker" data-ticker aria-hidden="true"></div>
      <section class="products" aria-label="Shop">
        <!-- The shop is the coffee, by roast. Accessories and Limited Drop (from the menu) show here
             instead, with their name and, for accessories, their kinds. -->
        <div class="shop-head">
          <h1 class="shop-title" data-shop-title></h1>
          <div class="filters" role="group" aria-label="Filter" data-shop-filters></div>
        </div>
        <div class="shop-empty" data-shop-empty role="status" hidden></div>
        <ul class="product-grid" data-products></ul>
      </section>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
