<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Checkout — Mimi Food</title>
  <meta name="description" content="Complete your Mimi Food order.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mimi Food">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Mimi Food">
  <meta property="og:title" content="Checkout — Mimi Food">
  <meta property="og:description" content="Complete your Mimi Food order.">
  <meta property="og:image" content="%SITE_URL%/assets/og-home.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/assets/favicon-96.png" type="image/png" sizes="96x96">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="checkout">
  <main id="main">

    <div class="page" data-checkout>
      <header class="page-head" data-reveal>
        <h1>Checkout</h1>
      </header>

      <div class="checkout-layout">
        <form class="form" data-checkout-form data-reveal novalidate>
          <!-- Express checkout: Apple Pay on Apple devices, Google Pay on Android, shown only when
               the device can pay that way. The wallet supplies name, email, phone and address. -->
          <div class="express" data-express hidden>
            <button type="button" class="button wallet-button" data-express-apple aria-label="Check out with Apple Pay" hidden><span>Check out with</span><svg class="apple-logo" viewBox="0 0 814 1000" aria-hidden="true"><path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76.5 0-103.7 40.8-165.9 40.8s-105.6-57-155.5-127C46.7 790.7 0 663 0 541.8c0-194.4 126.4-297.5 250.8-297.5 66.1 0 121.2 43.4 162.7 43.4 39.5 0 101.1-46 176.3-46 28.5 0 130.9 2.6 198.3 99.2zm-234-181.5c31.1-36.9 53.1-88.1 53.1-139.3 0-7.1-.6-14.3-1.9-20.1-50.6 1.9-110.8 33.7-147.1 75.8-28.5 32.4-55.1 83.6-55.1 135.5 0 7.8 1.3 15.6 1.9 18.1 3.2.6 8.4 1.3 13.6 1.3 45.4 0 102.5-30.4 135.5-71.3z"/></svg><span>Pay</span></button>
            <div id="express-google" hidden></div>
            <p class="express-error sub-error" data-express-error role="alert"></p>
            <p class="pay-or"><span>or</span></p>
          </div>
          <p class="section-label">Contact details</p>
          <div class="form-grid">
            <label>Name<input name="name" required autocomplete="name"></label>
            <label>Email<input name="email" type="email" required autocomplete="email"></label>
          </div>
          <label>Phone<input name="phone" type="tel" autocomplete="tel" inputmode="tel" required></label>

          <div class="cafe-box" data-cafe-box hidden></div>

          <!-- Delivered or picked up first, so pickup skips the address. Once the address is in,
               one card per way to deliver it (a local courier when it's close, and shipping). -->
          <fieldset class="delivery-choice" data-fulfilment>
            <legend>Delivery</legend>
            <input type="hidden" name="fulfilment" value="Delivery">
            <div class="delivery-mode" data-delivery-mode></div>
            <div class="form" data-ship-fields>
              <label>Address<input name="address" autocomplete="street-address"></label>
              <div class="form-grid form-grid--3">
                <label>City<input name="city" autocomplete="address-level2"></label>
                <label>State<select name="state" autocomplete="address-level1" data-states><option value="">Choose…</option></select></label>
                <label>ZIP code<input name="postcode" autocomplete="postal-code" inputmode="numeric"></label>
              </div>
              <div class="address-check" data-address-check role="status" hidden></div>
              <div class="delivery-zone" data-delivery-zone></div>
            </div>
          </fieldset>

          <div class="gift-sends" data-gift-sends hidden></div>

          <label>Order notes<textarea name="notes" placeholder="Anything we should know?"></textarea></label>
          <p class="sub-account-note" data-sub-account hidden></p>
          <!-- Card payment on this page (Square's card fields), when payments are on. -->
          <div class="pay-inline" data-pay-inline hidden>
            <p class="section-label">Payment</p>
            <div class="card-frame" id="card-container"><p class="muted">Loading secure payment…</p></div>
          </div>
          <p class="sub-error" data-order-error role="alert"></p>
          <button class="button" type="submit">Place Order</button>
          <p class="checkout-note" data-checkout-note></p>
        </form>

        <aside class="summary" data-summary data-reveal style="--i:1" aria-label="Order summary"></aside>
      </div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
